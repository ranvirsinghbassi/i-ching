<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The I Ching | Oracle</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg-white: #FFFFFF;
            --text-black: #1A1A1A;
            --vibrant-blue: #0044D6;
            --vibrant-red: #D60036;
            --blue-red-split: linear-gradient(90deg, var(--vibrant-blue) 50%, var(--vibrant-red) 50%);
            --pen-stroke-black: rgba(26, 26, 26, 0.95);
        }

        body {
            font-family: 'Caveat', cursive;
            background-color: #FAFAFA; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: clamp(1.5rem, 4vw, 3rem);
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0 1rem;
            z-index: 1; 
        }

        /* --- THE COLOR SPLIT TARGETS --- */
        h1, .reading-title, .ai-loading, .text-btn, .tts-word.active {
            background: var(--blue-red-split);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 4.5rem);
            letter-spacing: 0.05em;
            margin-bottom: -0.5rem; 
            font-weight: 700;
        }

        .subtitle {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #666;
        }

        .oracle-container {
            position: relative;
            z-index: 10; 
            background-color: var(--bg-white);
            max-width: 650px;
            width: 92%;
            margin: clamp(10rem, 25vw, 14rem) auto 4rem auto; 
            padding: clamp(2.5rem, 6vw, 4rem) clamp(1.5rem, 5vw, 2.5rem);
            border-radius: 15px 225px 12px 255px / 255px 12px 225px 15px;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
            transition: all 0.4s ease;
        }

        .question-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 2rem;
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .question-label {
            font-size: clamp(1.8rem, 5vw, 2.2rem);
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--text-black);
        }

        /* Border Gradients for Inputs and Coins */
        .question-input, .coin, .symbol-yin, .symbol-blank, .tts-btn {
            border-color: transparent !important;
            background: linear-gradient(var(--bg-white), var(--bg-white)) padding-box,
                        var(--blue-red-split) border-box;
        }

        .question-input {
            width: 100%;
            font-family: 'Caveat', cursive;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            color: var(--text-black);
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            resize: none;
            outline: none;
            border-style: solid;
            border-width: 1.5px 2px 2.5px 1px;
            border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
            transition: transform 0.3s ease;
        }

        .question-input::placeholder { color: #999; }

        #toss-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .ai-loading {
            display: none;
            font-size: 1.8rem;
            margin: 2rem 0;
            font-weight: 600;
        }
        
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .hexagram-display {
            display: none; 
            flex-direction: column-reverse;
            align-items: center;
            gap: clamp(10px, 3vw, 14px);
            margin: 0 auto 3.5rem auto;
            min-height: 200px;
            width: 100%;
        }

        #active-area.has-history {
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 2rem;
            margin-top: 1rem;
        }

        .yao-line {
            width: 100%;
            max-width: 180px; 
            height: clamp(12px, 3vw, 18px);
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wavy-line-svg {
            width: 100%;
            height: 100%;
            overflow: visible; 
        }

        .pen-path {
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke: var(--pen-stroke-black);
            transition: stroke 0.4s ease;
        }

        /* SVG Gradient Application */
        .yao-line.changing .pen-path, .tts-icon {
            stroke: url(#blueRedSplitGrad);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes subtleWave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .coins {
            display: flex;
            justify-content: center;
            gap: clamp(1.2rem, 5vw, 2.5rem);
            margin-bottom: 3.5rem;
            min-height: 70px;
            perspective: 800px;
        }

        .coin {
            width: clamp(50px, 15vw, 64px);
            height: clamp(50px, 15vw, 64px);
            border-style: solid;
            border-width: 2px 1.5px 2.5px 1.5px; 
            border-radius: 47% 53% 51% 49% / 52% 48% 53% 47%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transform-style: preserve-3d;
        }

        @keyframes tossCoin {
            0% { transform: translate(0, 0) rotateX(0) rotateY(0) rotateZ(0) scale(1); }
            50% { transform: translate(var(--tx), var(--ty)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(1.1); }
            100% { transform: translate(0, 0) rotateX(0) rotateY(0) rotateZ(0) scale(1); }
        }

        .symbol-yang {
            width: clamp(16px, 4vw, 22px);
            height: clamp(16px, 4vw, 22px);
            background: var(--blue-red-split);
            border-radius: 45% 55% 49% 51% / 54% 46% 52% 48%;
        }

        .symbol-yin, .symbol-blank {
            width: clamp(12px, 3.5vw, 16px);
            height: clamp(12px, 3.5vw, 16px);
            border-style: solid;
            border-width: 1.5px 2px 1px 2px;
            border-radius: 4px 12px 5px 10px / 12px 4px 10px 5px; 
        }

        .btn {
            font-family: 'Caveat', cursive;
            border-color: transparent;
            background: linear-gradient(var(--bg-white), var(--bg-white)) padding-box,
                        var(--blue-red-split) border-box;
            color: var(--text-black);
            border-style: solid;
            border-width: 1.5px 2px 2.5px 1px;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; 
            padding: clamp(0.6rem, 2vw, 0.8rem) clamp(1.5rem, 5vw, 2.5rem);
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            margin: 0.5rem;
        }

        .btn:hover, .btn:active { 
            background: var(--blue-red-split) padding-box,
                        var(--blue-red-split) border-box;
            color: var(--bg-white);
            -webkit-text-fill-color: var(--bg-white);
        }
        
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        
        .text-btn {
            font-family: 'Caveat', cursive;
            border: none;
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0.5rem;
            transition: opacity 0.3s ease;
        }

        .text-btn:hover { opacity: 0.6; -webkit-text-fill-color: var(--text-black); }

        .reading-result {
            display: none;
            margin-top: 1rem; 
            padding-top: 2rem;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            animation: slideUpFade 1s forwards;
            scroll-margin-top: 140px; /* NEW: Prevents the fixed header from covering the title */
        }

        /* NEW: Removes the faint line and extra padding from the very first reading */
        #readings-history .reading-result:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        .reading-title {
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        
        .reading-question-display {
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            font-style: italic;
            margin-bottom: 2rem;
            color: #666;
        }

        .tts-btn {
            border-style: solid;
            border-width: 1.5px 2px 1px 2px;
            border-radius: 48% 52% 55% 45% / 51% 49% 45% 55%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto 1.5rem auto;
            transition: all 0.3s ease;
        }

        .tts-btn:hover { transform: scale(1.05); }
        .tts-icon { width: 22px; height: 22px; stroke-width: 2; }
        
        .tts-word { transition: opacity 0.15s ease-in-out; }

        .reading-poem {
            font-size: clamp(1.2rem, 4vw, 2rem); 
            line-height: 1.5;
            margin: 2rem 0;
            text-align: center;
            font-weight: 600;
            text-wrap: balance;
            color: var(--text-black); 
        }

        .reading-desc {
            font-size: clamp(1.3rem, 4.5vw, 1.6rem);
            line-height: 1.6;
            text-align: justify;
            color: #444;
        }
        
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--text-black);
            color: var(--bg-white);
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }

    </style>
</head>
<body>
    
    <svg width="0" height="0" style="position:absolute;" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="blueRedSplitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="50%" stop-color="#0044D6" />
                <stop offset="50%" stop-color="#D60036" />
            </linearGradient>
        </defs>
    </svg>

    <header onclick="resetOracle()" style="cursor: pointer;">
        <h1>I CHING</h1>
        <div class="subtitle">The Book of Changes</div>
    </header>
    
    <div class="oracle-container">
        <div id="readings-history"></div>
    
        <div id="initial-loading" class="ai-loading" style="display:none; text-align:center;">Retrieving scroll<span class="dots"></span></div>
    
        <div id="active-area">
            <div class="question-section" id="question-section">
                <div class="question-label">Find the question from your heart...</div>
                <textarea id="user-question" class="question-input" rows="3" placeholder="What guidance do you seek today?"></textarea>
                <button class="btn" onclick="startReading()">Seek Wisdom</button>
            </div>
    
            <div class="hexagram-display" id="hexagram" style="display:none;"></div>
    
            <div id="toss-section" style="display:none;">
                <div class="coins" id="coins-container">
                    <div class="coin"><div class="symbol-blank"></div></div>
                    <div class="coin"><div class="symbol-blank"></div></div>
                    <div class="coin"><div class="symbol-blank"></div></div>
                </div>
                <button class="btn" id="toss-btn" onclick="tossCoins()">Cast the Coins</button>
                <div id="ai-loading" class="ai-loading">Consulting the oracle<span class="dots"></span></div>
            </div>
        </div>
    </div>
    
    <div id="toast">Link copied to clipboard!</div>

    <script>
        const workerUrl = 'https://iching-oracle-api.tim-and-ranvir.workers.dev'; 
        
        let currentLine = 1;
        let hexagramBinary = ""; 
        let userQuestionText = "";
        let ttsUtterance = null;
        let ttsWordSpans = [];
        let rawTTSString = "";
        let currentSessionHistory = [];
        let currentCast = []; // NEW: Memory array to store the exact coin sums (6, 7, 8, 9)

        window.speechSynthesis.getVoices();

        const hexagramDatabase = {

            "101000": { id: 36, title: "36. Ming I / Darkening of the Light" },
            "101011": { id: 37, title: "37. Chia Jen / The Family" },
            "110101": { id: 38, title: "38. K'uei / Opposition" },

            "001100": { id: 62, title: "62. Hsiao Kuo / Preponderance of the Small" },
            "101010": { id: 63, title: "63. Chi Chi / After Completion" },
            "010101": { id: 64, title: "64. Wei Chi / Before Completion" },
            "default": { id: "reading", title: "A Message from the Oracle" }
        };

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const savedId = urlParams.get('id');
            
            if (savedId) {
                document.getElementById('question-section').style.display = 'none';
                document.getElementById('initial-loading').style.display = 'block';
                loadSavedReading(savedId);
            }
        };

        function resetOracle() {
            window.location.href = window.location.origin + window.location.pathname;
        }

        function consultAgain() {
            window.speechSynthesis.cancel();
            
            const oldControls = document.querySelectorAll('.session-controls, .active-tts-btn');
            oldControls.forEach(b => b.style.display = 'none');

            document.getElementById('hexagram').innerHTML = "";
            document.getElementById('hexagram').style.display = 'none';
            document.getElementById('toss-section').style.display = 'none';
            document.getElementById('toss-btn').style.display = "inline-block";
            document.getElementById('toss-btn').disabled = false;
            document.getElementById('coins-container').style.display = "flex";
            document.querySelectorAll('.coin').forEach(c => c.innerHTML = '<div class="symbol-blank"></div>');
            
            const qLabel = document.querySelector('.question-label');
            const qInput = document.getElementById('user-question');
            
            if (currentSessionHistory.length > 0) {
                document.getElementById('active-area').classList.add('has-history');
                qLabel.innerText = "Delve deeper into the changes...";
                qInput.placeholder = "What further guidance do you seek?";
            } else {
                document.getElementById('active-area').classList.remove('has-history');
                qLabel.innerText = "Hold a question in your mind...";
                qInput.placeholder = "What guidance do I seek today?";
            }

            document.getElementById('question-section').style.display = 'flex';
            qInput.value = "";
            
            currentLine = 1;
            hexagramBinary = "";
            currentCast = []; // Clear the memory for the new cast

            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        async function fetchAIReading(hexagramString, userQuestion) {
            const baseHexagram = hexagramDatabase[hexagramString] || hexagramDatabase["default"];
            
            // NEW: We hijack the ID field to attach the exact coin tosses (e.g. "45|888976") 
            // so the worker saves it without needing a backend database update!
            const exactCastId = baseHexagram.id + "|" + currentCast.join(""); 
            
            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        hexagramId: exactCastId, 
                        hexagramTitle: baseHexagram.title,
                        question: userQuestion,
                        history: currentSessionHistory 
                    })
                });

                const aiData = await response.json();
                
                if (!response.ok || aiData.error) {
                    throw new Error("The oracle's connection was disrupted.");
                }

                currentSessionHistory = aiData.sessionHistory; 
                displayResult(aiData);
                
            } catch (error) {
                console.error("Reading failed:", error);
                
                const randomId = Math.random().toString(36).substring(2, 10);
                const fallbackReading = {
                    id: randomId,
                    hexagramId: exactCastId, // Ensure fallback also gets the correct visual lines
                    title: baseHexagram.title,
                    question: userQuestion,
                    poem: "The winds of heaven are silent today,\nThe waters are still, the clouds are gray.",
                    desc: "The oracle could not be reached at this moment. The energies are clouded. Please take a breath and consult again in a few moments."
                };
                
                currentSessionHistory.push(fallbackReading);
                displayResult(fallbackReading);
            }
        }

        // NEW: Advanced reconstructor that reads the hijacked ID string to draw changing lines
        function generateExactLines(hexagramId, title) {
            let castArray = [];
            
            const idString = String(hexagramId);
            if (idString.includes('|')) {
                // If it's a new reading with our special ID ("45|888976"), extract the exact tosses
                const parts = idString.split('|');
                castArray = parts[1].split('').map(Number); 
            } else {
                // FALLBACK: If opening an old reading, default to plain black lines
                let binStr = "";
                for (const [key, val] of Object.entries(hexagramDatabase)) {
                    if (val.title === title) {
                        binStr = key;
                        break;
                    }
                }
                if (!binStr || binStr === "default") return "";
                castArray = binStr.split('').map(bit => bit === "1" ? 7 : 8);
            }

            let html = "";
            for (let i = 0; i < castArray.length; i++) {
                const sum = castArray[i];
                const isYin = (sum === 6 || sum === 8);
                const isChanging = (sum === 6 || sum === 9);
                
                const duration = (10.0 + Math.random() * 6.0).toFixed(2);
                const delay = (Math.random() * -4).toFixed(2);
                const changingClass = isChanging ? " changing" : "";
                
                let paths = "";
                if (isYin) {
                    paths = `<path class="pen-path" d="${generateHandDrawnPath(0, 85, 2.5)}" stroke-width="4.5"></path>
                             <path class="pen-path" d="${generateHandDrawnPath(115, 200, 2.5)}" stroke-width="4.5"></path>`;
                } else {
                    paths = `<path class="pen-path" d="${generateHandDrawnPath(0, 200, 2.5)}" stroke-width="4.5"></path>`;
                }

                html += `<div class="yao-line${changingClass}"><svg class="wavy-line-svg" viewBox="0 0 200 20" preserveAspectRatio="none" style="animation: subtleWave ${duration}s ease-in-out ${delay}s infinite;">${paths}</svg></div>`;
            }
            return html;
        }

        function displayResult(data) {
            document.getElementById('ai-loading').style.display = "none";
            document.getElementById('question-section').style.display = 'none';

            const resultBlock = document.createElement('div');
            resultBlock.className = 'reading-result';
            resultBlock.style.display = 'block';
            
            const shareId = data.id;
            window.history.pushState({}, '', `?id=${shareId}`);

            rawTTSString = `${data.title}. ${data.poem}. ${data.desc}`;
            ttsWordSpans = []; 

            const hexArea = document.getElementById('hexagram');
            let currentHexagramHtml = hexArea.innerHTML;
            hexArea.innerHTML = ""; 

            // FIX: Uses the exact memory to perfectly reconstruct the changing lines!
            if (!currentHexagramHtml.trim()) {
                currentHexagramHtml = generateExactLines(data.hexagramId, data.title);
            }

            resultBlock.innerHTML = `
                <div class="hexagram-display" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; margin-bottom: 4rem;">
                    ${currentHexagramHtml}
                </div>
                <div class="reading-title">${data.title}</div>
                <div class="reading-question-display">"${data.question}"</div>
                
                <button class="tts-btn active-tts-btn" onclick="toggleTTS(this)" aria-label="Read Aloud">
                    <svg class="tts-icon-play tts-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <svg class="tts-icon-stop tts-icon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>

                <div class="reading-poem"></div>
                <div class="reading-desc"></div>
                
                <div class="session-controls" style="margin-top: 3rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                    <button class="text-btn" onclick="shareReading()">Share</button>
                    <button class="btn" onclick="consultAgain()">Continue Your Questioning</button>
                </div>
            `;

            let poemContainer = resultBlock.querySelector('.reading-poem');
            let descContainer = resultBlock.querySelector('.reading-desc');
            let currentOffset = data.title.length + 2; 
            
            currentOffset = formatTextForTTS(data.poem, poemContainer, true, currentOffset);
            currentOffset += 2; 
            formatTextForTTS(data.desc, descContainer, false, currentOffset);

            document.getElementById('readings-history').appendChild(resultBlock);
            
            setTimeout(() => {
                resultBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        async function loadSavedReading(id) {
            try {
                const response = await fetch(`${workerUrl}?id=${id}`);
                const historyData = await response.json();
                
                document.getElementById('initial-loading').style.display = 'none';
                document.getElementById('question-section').style.display = 'none';

                historyData.forEach((reading, index) => {
                    currentSessionHistory.push(reading);
                    displayResult(reading);
                    
                    if (index < historyData.length - 1) {
                        const ctrls = document.querySelectorAll('.session-controls, .active-tts-btn');
                        ctrls[ctrls.length-1].style.display = 'none';
                    }
                });
            } catch (e) { resetOracle(); }
        }

        function startReading() {
            const input = document.getElementById('user-question').value.trim();
            userQuestionText = input || "Provide a general reading.";
            
            document.getElementById('question-section').style.display = 'none';
            document.getElementById('toss-section').style.display = 'flex';
            document.getElementById('hexagram').style.display = 'flex'; 

            // NEW: Smoothly scroll the coin tossing section perfectly into the center of the screen
            setTimeout(() => {
                document.getElementById('toss-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function tossCoins() {
            if (currentLine > 6) return;
            const coins = document.querySelectorAll('.coin');
            const btn = document.getElementById('toss-btn');
            btn.disabled = true;

            coins.forEach(coin => {
                coin.innerHTML = ''; 
                coin.style.animation = 'none';
                void coin.offsetWidth; 
                
                const rx = (Math.random() * 720 + 720) * (Math.random() > 0.5 ? 1 : -1);
                const ry = (Math.random() * 720 + 720) * (Math.random() > 0.5 ? 1 : -1);
                const rz = (Math.random() * 360) * (Math.random() > 0.5 ? 1 : -1);
                const tx = (Math.random() * 60 - 30); 
                const ty = -(Math.random() * 40 + 40); 
                
                coin.style.setProperty('--rx', `${rx}deg`);
                coin.style.setProperty('--ry', `${ry}deg`);
                coin.style.setProperty('--rz', `${rz}deg`);
                coin.style.setProperty('--tx', `${tx}px`);
                coin.style.setProperty('--ty', `${ty}px`);
                
                coin.style.animation = 'tossCoin 0.6s cubic-bezier(0.3, 0.1, 0.3, 1) forwards';
            });

            setTimeout(() => {
                let sum = 0;
                let coinResults = [];
                for (let i = 0; i < 3; i++) {
                    let val = Math.random() > 0.5 ? 3 : 2; 
                    sum += val;
                    coinResults.push(val);
                }
                
                // NEW: Push the exact sum into the memory array!
                currentCast.push(sum);

                coins.forEach((coin, index) => {
                    coin.innerHTML = ''; 
                    const symbol = document.createElement('div');
                    symbol.className = coinResults[index] === 3 ? 'symbol-yang' : 'symbol-yin';
                    coin.appendChild(symbol);
                });

                drawLine(sum);

                currentLine++;
                if (currentLine <= 6) {
                    btn.disabled = false;
                } else {
                    btn.style.display = "none";
                    document.getElementById('coins-container').style.display = "none";
                    document.getElementById('ai-loading').style.display = "block";
                    fetchAIReading(hexagramBinary, userQuestionText);
                }
            }, 600); 
        }

        function generateHandDrawnPath(startX, endX, woggleHeight) {
            const width = endX - startX;
            const yMid = 10; 
            const segments = Math.max(1, Math.floor(width / 30)); 
            const segmentWidth = width / segments;
            let path = `M ${startX} ${(yMid + (Math.random() - 0.5) * woggleHeight).toFixed(2)}`;
            let currentX = startX;
            for (let i = 0; i < segments; i++) {
                const nextX = currentX + segmentWidth;
                const c1x = currentX + segmentWidth / 3;
                const c2x = currentX + 2 * segmentWidth / 3;
                const c1y = yMid + (Math.random() - 0.5) * (woggleHeight * 2);
                const c2y = yMid + (Math.random() - 0.5) * (woggleHeight * 2);
                const endY = yMid + (Math.random() - 0.5) * woggleHeight;
                path += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${nextX.toFixed(2)} ${endY.toFixed(2)}`;
                currentX = nextX;
            }
            return path;
        }

        function drawLine(sum) {
            const hexArea = document.getElementById('hexagram');
            const lineDiv = document.createElement('div');
            lineDiv.classList.add('yao-line'); 

            if (sum === 6 || sum === 9) lineDiv.classList.add('changing');

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("class", "wavy-line-svg");
            svg.setAttribute("viewBox", "0 0 200 20");
            svg.setAttribute("preserveAspectRatio", "none"); 

            const duration = (10.0 + Math.random() * 6.0).toFixed(2); 
            const delay = (Math.random() * -4).toFixed(2);
            svg.style.animation = `subtleWave ${duration}s ease-in-out ${delay}s infinite`;

            const naturalWobble = 2.5; 

            if (sum === 6 || sum === 8) {
                const path1 = document.createElementNS(svgNS, "path");
                path1.setAttribute("class", "pen-path");
                path1.setAttribute("d", generateHandDrawnPath(0, 85, naturalWobble));
                path1.setAttribute("stroke-width", "4.5"); 
                svg.appendChild(path1);

                const path2 = document.createElementNS(svgNS, "path");
                path2.setAttribute("class", "pen-path");
                path2.setAttribute("d", generateHandDrawnPath(115, 200, naturalWobble));
                path2.setAttribute("stroke-width", "4.5");
                svg.appendChild(path2);
                hexagramBinary += "0"; 
            } else {
                const path = document.createElementNS(svgNS, "path");
                path.setAttribute("class", "pen-path");
                path.setAttribute("d", generateHandDrawnPath(0, 200, naturalWobble));
                path.setAttribute("stroke-width", "4.5");
                svg.appendChild(path);
                hexagramBinary += "1";
            }

            lineDiv.appendChild(svg);
            hexArea.appendChild(lineDiv);
        }

        function formatTextForTTS(text, containerElement, isPoem, currentOffset) {
            containerElement.innerHTML = '';
            const tokens = text.match(/\S+|\s+/g) || [];
            
            tokens.forEach(token => {
                if (/\S/.test(token)) { 
                    const span = document.createElement('span');
                    span.className = 'tts-word';
                    span.innerText = token;
                    containerElement.appendChild(span);
                    ttsWordSpans.push({ element: span, start: currentOffset, end: currentOffset + token.length });
                } else { 
                    if (isPoem && token.includes('\n')) {
                        const newlines = (token.match(/\n/g) || []).length;
                        for(let i = 0; i < newlines; i++) {
                            containerElement.appendChild(document.createElement('br'));
                        }
                    } else {
                        containerElement.appendChild(document.createTextNode(token));
                    }
                }
                currentOffset += token.length;
            });
            return currentOffset;
        }

        function shareReading() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'The I Ching Oracle',
                    text: 'Read my I Ching oracle reading:',
                    url: url
                }).catch(err => { fallbackCopy(url); });
            } else { fallbackCopy(url); }
        }

        function fallbackCopy(url) {
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
            }).catch(err => { alert("Please manually copy the URL to share."); });
        }

        function toggleTTS(btnElement) {
            const synth = window.speechSynthesis;
            const playIcon = btnElement.querySelector('.tts-icon-play');
            const stopIcon = btnElement.querySelector('.tts-icon-stop');

            if (synth.speaking) {
                synth.cancel();
                resetTTSUI();
                return;
            }

            ttsUtterance = new SpeechSynthesisUtterance(rawTTSString);
            ttsUtterance.rate = 0.75; 
            
            const voices = synth.getVoices();
            const britishMaleVoice = voices.find(v => (v.lang.includes('en-GB') || v.lang.includes('en_GB')) && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('ryan') || v.name.toLowerCase().includes('arthur'))) 
            || voices.find(v => (v.lang.includes('en-GB') || v.lang.includes('en_GB')) && !v.name.toLowerCase().includes('female') && !v.name.toLowerCase().includes('serena')) 
            || voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male')) 
            || voices[0];
            
            if (britishMaleVoice) ttsUtterance.voice = britishMaleVoice;

            ttsUtterance.onboundary = (event) => {
                if (event.name === 'word') {
                    ttsWordSpans.forEach(item => {
                        if (event.charIndex >= item.start && event.charIndex < item.end) {
                            item.element.classList.add('active');
                        } else {
                            item.element.classList.remove('active');
                        }
                    });
                }
            };

            ttsUtterance.onend = () => { resetTTSUI(); };
            ttsUtterance.onerror = () => { resetTTSUI(); };

            playIcon.style.display = 'none';
            stopIcon.style.display = 'block';

            synth.speak(ttsUtterance);
        }

        function resetTTSUI() {
            document.querySelectorAll('.tts-icon-play').forEach(i => i.style.display = 'block');
            document.querySelectorAll('.tts-icon-stop').forEach(i => i.style.display = 'none');
            document.querySelectorAll('.tts-word').forEach(w => w.classList.remove('active'));
        }

    </script>
</body>
